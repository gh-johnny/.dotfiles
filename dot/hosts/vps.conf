# The VPS: cli + dev tooling and sshd, with the minimal VPS shell from vps/ instead of my zshrc.
# shellcheck shell=bash disable=SC2034
include cli
DOT_GROUPS+=(dev ai sshd)
drop DOT_STOW zsh # vps/zshrc is copied, not linked (see vps/install.sh)
DOT_MODULES+=(uv npm installers services)

host_post_apply() {
  cmp -s "$DOTFILES/vps/zshrc" "$HOME/.zshrc" && cmp -s "$DOTFILES/vps/ai" "$HOME/.local/bin/ai" && return 0
  act bash "$DOTFILES/vps/install.sh"
}
