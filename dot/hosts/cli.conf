# Terminal only: zsh, neovim, tmux and the CLI tools. Any distro, containers included.
# shellcheck shell=bash disable=SC2034
DOT_GROUPS+=(base cli)
DOT_STOW+=(zsh git tmux nvim lazygit btop fastfetch starship mise)
DOT_STOW_NOFOLD+=(mise) # dot writes conf.d/dot.toml next to the stowed config.toml
DOT_MODULES+=(self system links shell mise)
DOT_SHELL=zsh
